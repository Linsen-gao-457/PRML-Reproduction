seed: 123
sample_size: 50
output: outputs/figures/figure_2_24.png

mixture:
  - weight: 0.3
    mean: 0.3
    standard_deviation: 0.1

  - weight: 0.7
    mean: 0.8
    standard_deviation: 0.1

histogram:
  bin_widths: [0.04, 0.08, 0.25]
  color: "#7777ee"
  edge_color: black

density_curve:
  color: "#00dd00"
  line_width: 2

plot:
  x_min: 0.0
  x_max: 1.0
  y_min: 0.0
  y_max: 5.0
  grid_points: 500
  figure_width: 6
  figure_height: 6
