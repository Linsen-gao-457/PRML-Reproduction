seed: 123
sample_size: 50

mixture:
  - weight: 0.3
    mean: 0.3
    standard_deviation: 0.1

  - weight: 0.7
    mean: 0.8
    standard_deviation: 0.1

kernel:
  bandwidths: [0.005, 0.07, 0.2]
  color: blue
  line_width: 2

true_density:
  color: "#00dd00"
  line_width: 2

plot:
  x_min: 0.0
  x_max: 1.0
  y_min: 0.0
  y_max: 6.0
  grid_points: 1000
  figure_width: 6
  figure_height: 6

output: outputs/figures/figure_2_25.png
