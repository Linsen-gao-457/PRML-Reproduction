[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prml-reproduction"
version = "0.1.0"
description = "Reproductions of figures and algorithms from Pattern Recognition and Machine Learning"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.9.4,<4",
    "numpy>=2.0.2,<3",
    "PyYAML>=6.0.3,<7",
    "scipy>=1.13.1,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4.2,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
